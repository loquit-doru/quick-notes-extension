  <meta http-equiv="refresh" content="0; url=https://getquicknotes.vercel.app/">

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0b1020;
      color: #e6ebff;
      display: grid;
      place-items: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
      padding: 24px;
    }
    a { color: #a78bfa; }
  </style>
</head>
<body>
  <main>
    <h1>Quick Notes</h1>
    <p>

      <a href="https://getquicknotes.vercel.app/">getquicknotes.vercel.app</a>&hellip;

    <p><a href="privacy.html">Privacy policy</a></p>
  </main>

  <script>

    location.replace('https://getquicknotes.vercel.app/');
  </script>
</body>
</html>
